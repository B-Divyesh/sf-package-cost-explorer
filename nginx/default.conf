server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # The generated shell and each client-side route must always revalidate.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # A service worker must never be held behind a stale HTTP cache.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Vite content-hashes JS, CSS, WASM, and source maps; those files are safe
    # to retain indefinitely. Public images do not have content hashes and use
    # the short-lived static rule below instead.
    location ~* "^/assets/.*-[A-Za-z0-9_-]{8,}\\.(?:css|js|map|wasm)$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Static requests should be a real file, never a masked SPA response.
    location ~* \.(?:avif|css|ico|js|json|map|png|svg|txt|wasm|webmanifest|webp|xml)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # The app owns /privacy and /terms (and future client routes), so unknown
    # navigations receive the shell while static paths above retain true 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
